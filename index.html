<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Student Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: white;
}

/* HEADER */
header {
    text-align: center;
    padding: 25px;
    font-size: 30px;
    font-weight: 600;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
}

/* CONTAINER */
.container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 40px 15px;
}

/* CARD */
.card {
    width: 100%;
    max-width: 1000px;
    padding: 25px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    transition: transform 0.2s ease;
}

/* TITLE */
h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* BUTTON */
.btn {
    display: block;
    margin: 0 auto 20px;
    padding: 12px 30px;
    border-radius: 40px;
    border: none;
    background: linear-gradient(135deg, #6366f1, #06b6d4);
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.btn:hover {
    transform: scale(1.05);
}

/* EXCEL VIEW */
iframe {
    width: 100%;
    height: 650px;
    border-radius: 12px;
    border: none;
    background: white;
}

/* FOOTER */
.footer {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
    font-size: 13px;
}

/* BADGE */
.badge {
    padding: 5px 12px;
    border-radius: 20px;
    background: #22c55e;
    color: black;
}

/* MOBILE FIX */
@media(max-width: 600px) {
    iframe {
        height: 500px;
    }
}
</style>
</head>

<body>

<header>
🚀 AI-Based Student Performance Dashboard
</header>

<div class="container">
<div class="card" id="card">

<h2>Live Excel Report Viewer</h2>

<button class="btn" onclick="loadExcel()">⚡ Load Report Card</button>

<iframe id="excelFrame"></iframe>

<div class="footer">
    <p>Made by Saurabh Singh</p>
    <span class="badge">AI Insights Enabled</span>
</div>

</div>
</div>

<script>

// 🔥 EXCEL LOAD FUNCTION
function loadExcel() {
    document.getElementById("excelFrame").src =
    "https://1drv.ms/x/c/7dce023d2dc70f7d/IQQ7lCwZphJ5RJVo52rCGxMcAW7AGebnt7i_F8LDldziazQ?em=2&wdAllowInteractivity=False&wdHideGridlines=True&wdHideHeaders=True&wdDownloadButton=True&wdInConfigurator=True&wdInConfigurator=True";
}

// 🔥 AUTO LOAD (optional)
window.onload = function() {
    loadExcel();
};

// 🔥 3D EFFECT
const card = document.getElementById("card");

card.addEventListener("mousemove", (e) => {
    let x = e.offsetX;
    let y = e.offsetY;
    let rotateX = (y / 400 - 0.5) * 8;
    let rotateY = (x / 800 - 0.5) * 8;

    card.style.transform = `rotateX(${-rotateX}deg) rotateY(${rotateY}deg)`;
});

card.addEventListener("mouseleave", () => {
    card.style.transform = "rotateX(0) rotateY(0)";
});

</script>

</body>
</html>
